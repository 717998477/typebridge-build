name: Build TV APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y unzip zip

      # sdkmanager(新版 cmdline-tools) 需要 JDK 17：必须在 Setup JDK 8 之前用默认 JDK 安装 SDK
      - name: Install Android SDK (build-tools 30.0.3 + android-30)
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;30.0.3" "platforms;android-30"

      - name: Setup JDK 8 (编译用)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 8

      - name: Build APK
        run: bash tv/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TypeBridgeTV.apk
          path: tv/TypeBridgeTV.apk

      # 手动触发 → 发布/更新 tv-latest；推送 v* tag → 发布到该 tag 的 Release
      - name: Publish to Releases
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || 'tv-latest' }}
          name: ${{ github.event_name == 'push' && github.ref_name || 'TypeBridge TV 最新构建' }}
          files: tv/TypeBridgeTV.apk
