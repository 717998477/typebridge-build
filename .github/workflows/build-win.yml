name: Build Win exe

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install mono
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mono-mcs mono-runtime \
            libmono-system-drawing4.0-cil \
            libmono-system-web-extensions4.0-cil \
            libmono-system-windows-forms4.0-cil

      - name: Build exe
        run: bash win/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TypeBridge.exe
          path: win/build/TypeBridge.exe

      # 手动触发 → 发布/更新 win-latest；推送 v* tag → 发布到该 tag 的 Release
      - name: Publish to Releases
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || 'win-latest' }}
          name: ${{ github.event_name == 'push' && github.ref_name || 'TypeBridge Win 最新构建' }}
          files: win/build/TypeBridge.exe
          generate_release_notes: true
